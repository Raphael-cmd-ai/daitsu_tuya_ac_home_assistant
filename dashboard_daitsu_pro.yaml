                        border-radius: 20px !important; padding: 14px !important;
                        border: 1px solid {{ 'rgba(255,255,255,0.25)' if active else 'rgba(255,255,255,0.07)' }} !important;
                        background: {{ 'linear-gradient(145deg, #ef4444, #f97316)' if active else 'linear-gradient(160deg, rgba(30,35,50,0.92), rgba(13,16,25,0.96))' }} !important;
                        box-shadow: {{ '0 10px 26px #ef444466' if active else '0 10px 26px rgba(0,0,0,0.45)' }} !important;
                      }

      # ========================================================================
      # SPALTE 2: GRAPHS (TEMPERATUR & INVERTER), LAMELLEN & OPTIONEN
      # ========================================================================
      - type: grid
        cards:
          # ApexChart 1: Raumklima-Verlauf (Ist · Soll · Außen)
          - type: custom:apexcharts-card
            grid_options:
              columns: full
            header:
              show: true
              title: RAUMKLIMA-VERLAUF (IST · SOLL · AUSSEN)
              show_states: true
              colorize_states: true
            graph_span: 24h
            now:
              show: true
              label: Jetzt
            apex_config:
              chart:
                height: 230
                toolbar:
                  show: false
              stroke:
                curve: smooth
                width: 3
              fill:
                type: gradient
                gradient:
                  shadeIntensity: 1
                  opacityFrom: 0.35
                  opacityTo: 0.02
                  stops: [0, 100]
              grid:
                borderColor: rgba(255, 255, 255, 0.06)
              legend:
                show: false
              xaxis:
                labels:
                  style:
                    colors: '#64748b'
              yaxis:
                labels:
                  style:
                    colors: '#64748b'
            series:
              - entity: sensor.schlafzimmer_daitsu_artic_plus_raumtemperatur
                name: Raum
                color: '#a855f7'
                type: area
                extend_to: now
                group_by:
                  func: avg
                  duration: 10min
              - entity: climate.schlafzimmer_daitsu_artic_plus
                attribute: temperature
                name: Soll
                color: '#f59e0b'
                type: line
                curve: stepline
                stroke_width: 2
                extend_to: now
              - entity: sensor.schlafzimmer_daitsu_artic_plus_aussentemperatur
                name: Außen
                color: '#38bdf8'
                type: line
                stroke_width: 2
                extend_to: now
                group_by:
                  func: avg
                  duration: 10min
            card_mod:
              style: >
                ha-card {
                  background: radial-gradient(120% 100% at 100% 0%, rgba(167,139,250, 0.16), transparent 60%), linear-gradient(160deg, rgba(30, 35, 50, 0.92), rgba(13, 16, 25, 0.96)) !important;
                  border: 1px solid rgba(255, 255, 255, 0.07) !important;
                  border-radius: 22px !important;
                  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45) !important;
                  padding: 8px !important;
                }

          # ApexChart 2: Live-Leistungsverlauf (Watt)
          - type: custom:apexcharts-card
            grid_options:
              columns: full
            header:
              show: true
              title: LIVE-LEISTUNG (WATT)
              show_states: true
              colorize_states: true
            graph_span: 12h
            now:
              show: true
              label: Jetzt
            apex_config:
              chart:
                height: 190
                toolbar:
                  show: false
              stroke:
                curve: smooth
                width: 2.5
              fill:
                type: gradient
                gradient:
                  shadeIntensity: 1
                  opacityFrom: 0.30
                  opacityTo: 0.02
                  stops: [0, 100]
              grid:
                borderColor: rgba(255, 255, 255, 0.06)
              legend:
                show: false
              xaxis:
                labels:
                  style:
                    colors: '#64748b'
              yaxis:
                min: 0
                labels:
                  style:
                    colors: '#64748b'
            series:
              - entity: sensor.schlafzimmer_daitsu_artic_plus_aktuelle_leistung
                name: Leistung (W)
                color: '#f59e0b'
                type: area
                extend_to: now
            card_mod:
              style: >
                ha-card {
                  background: radial-gradient(120% 100% at 100% 0%, rgba(249,115,22, 0.14), transparent 60%), linear-gradient(160deg, rgba(30, 35, 50, 0.92), rgba(13, 16, 25, 0.96)) !important;
                  border: 1px solid rgba(255, 255, 255, 0.07) !important;
                  border-radius: 22px !important;
                  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45) !important;
                  padding: 8px !important;
                }

          # Lamellensteuerung (Vertikal & Horizontal – exakte 9–13 Positionen)
          - type: custom:mushroom-title-card
            title: LUFTSTROM & LAMELLEN
            subtitle: 🌬️ 2D-POSITIONIERUNG // SCHWENKMODUS
            grid_options:
              columns: full
            card_mod:
              style: >
                ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding-top: 8px !important; padding-bottom: 4px !important; }
                .title { font-size: 16px !important; font-weight: 800 !important; letter-spacing: 2.5px !important; color: #cbd5e1 !important; }
                .subtitle { font-size: 10px !important; font-weight: 600 !important; letter-spacing: 1.5px !important; color: #64748b !important; text-transform: uppercase; }

          # Interaktives Tesla-Style 2D-Luftstrom-Pad (Finger / Maus + Pfeile + Schwenken)
