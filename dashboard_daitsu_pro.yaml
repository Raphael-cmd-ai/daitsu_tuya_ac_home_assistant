# ==============================================================================
# DAITSU ARTIC PLUS – PRO DASHBOARD (Mushroom + Card-Mod + ApexCharts + Gauges)
# Kompatibel mit der Custom Integration: daitsu_tuya_ac
# ==============================================================================
# Hinweis: Falls deine Entitäten leicht anders heißen (z. B. Umlaute),
# prüfe kurz unter Einstellungen -> Geräte -> Daitsu Artic Plus.

views:
  - type: sections
    title: Schlafzimmer Klimatisierung
    path: schlafzimmer-klima
    icon: mdi:air-conditioner
    max_columns: 2
    background: >-
      fixed radial-gradient(circle at 50% 25%, rgba(12, 28, 52, 0.95) 0%,
      rgba(5, 8, 15, 1) 100%)
    sections:
      # ========================================================================
      # SPALTE 1: HERO, GAUGES, KLIMA-ASSISTENT & SCHNELLWAHL
      # ========================================================================
      - type: grid
        cards:
          # Navigation Chips
          - type: custom:mushroom-chips-card
            alignment: center
            grid_options:
              columns: full
            chips:
              - type: template
                icon: mdi:home
                icon_color: grey
                content: Home
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/home
              - type: template
                icon: mdi:water-boiler
                icon_color: grey
                content: Boiler
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-warmwasser
              - type: template
                icon: mdi:air-conditioner
                icon_color: cyan
                content: Daitsu Klima
                tap_action:
                  action: navigate
                  navigation_path: /daitsu-klima
            card_mod:
              style: |
                :host {
                  --chip-background: rgba(24, 28, 42, 0.9);
                  --chip-border-width: 1px;
                  --chip-border-color: rgba(255, 255, 255, 0.1);
                  --chip-box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
                  --chip-height: 40px;
                  --chip-border-radius: 20px;
                  --chip-font-size: 13px;
                  --chip-font-weight: 700;
                }

          # Haupttitel
          - type: custom:mushroom-title-card
            title: CLIMATE CONTROL
            subtitle: ❄️ SEKTOR // SCHLAFZIMMER DAITSU ARTIC PLUS
            grid_options:
              columns: full
            card_mod:
              style: >
                ha-card { background: transparent !important; border: none
                !important; box-shadow: none !important; padding-top: 8px
                !important; padding-bottom: 4px !important; }
                .title { font-size: 22px !important; font-weight: 800
                !important; letter-spacing: 2.5px !important; color: #e2e8f0
                !important; }
                .subtitle { font-size: 11px !important; font-weight: 600
                !important; letter-spacing: 1.5px !important; color: #64748b
                !important; text-transform: uppercase; }

          # Aurora Hero Card + Direkt-Steuerung (Sollwert, Modus, Lüfter)
          - type: vertical-stack
            grid_options:
              columns: full
            cards:
              - type: custom:mushroom-template-card
                entity: climate.schlafzimmer_daitsu_artic_plus
                primary: >-
                  {{ '%.1f' |
                  format(state_attr('climate.schlafzimmer_daitsu_artic_plus',
                  'current_temperature') | float(0)) }} °C
                secondary: >-
                  {% set cl = states('climate.schlafzimmer_daitsu_artic_plus') %}
                  {% set fan = state_attr('climate.schlafzimmer_daitsu_artic_plus', 'fan_mode') or 'Auto' %}
                  {% set labels = {
                    'heat': '🔥 HEIZEN',
                    'cool': '❄️ KÜHLEN',
                    'auto': '⚙️ AUTO',
                    'dry': '💧 ENTFEUCHTEN',
                    'fan_only': '🌬️ LÜFTEN',
                    'off': '💤 SYSTEM AUS',
                    'unavailable': '⚠️ OFFLINE'
                  } %}
                  {{ labels.get(cl, cl | upper) }} • SOLL {{ '%.1f' |
                  format(state_attr('climate.schlafzimmer_daitsu_artic_plus', 'temperature')
                  | float(0)) }}°C • {{ fan | upper }}
                icon: >-
                  {% set cl = states('climate.schlafzimmer_daitsu_artic_plus') %}
                  {{ {
                    'heat': 'mdi:white-balance-sunny',
                    'cool': 'mdi:snowflake',
                    'auto': 'mdi:autorenew',
                    'dry': 'mdi:water-percent',
                    'fan_only': 'mdi:fan',
                    'off': 'mdi:power-sleep'
                  }.get(cl, 'mdi:air-conditioner') }}
                icon_color: >-
                  {% set cl = states('climate.schlafzimmer_daitsu_artic_plus') %}
                  {{ {
                    'heat': 'orange',
                    'cool': 'cyan',
                    'auto': 'teal',
                    'dry': 'light-blue',
                    'fan_only': 'teal',
                    'off': 'grey'
                  }.get(cl, 'cyan') }}
                layout: horizontal
                tap_action:
                  action: more-info
                card_mod:
                  style:
                    mushroom-state-info$: >
                      .primary { font-size: 40px !important; font-weight: 200
                      !important; letter-spacing: 2px !important; color: #f8fafc
                      !important; line-height: 1.05 !important;
                      font-variant-numeric: tabular-nums !important; }
                      .secondary { font-size: 10px !important; font-weight: 700
                      !important; letter-spacing: 1.2px !important; color:
                      #94a3b8 !important; margin-top: 6px !important; }
                    mushroom-shape-icon$: >
                      {% set cl = states('climate.schlafzimmer_daitsu_artic_plus') %}
                      {% set colors = {'heat':'#f97316','cool':'#06b6d4','auto':'#14b8a6','dry':'#38bdf8','fan_only':'#14b8a6','off':'#64748b'} %}
                      {% set c = colors.get(cl, '#06b6d4') %}
                      {% set running = cl not in ['off','unavailable','unknown'] %}
                      :host { --icon-size: 52px; --icon-symbol-size: 28px; }
                      .shape {
                        box-shadow: 0 0 22px {{ c }}99 !important;
                        {% if running %}animation: breathe-icon 3s ease-in-out infinite;{% endif %}
                      }
                      {% if running and cl in ['cool', 'fan_only'] %}ha-icon { animation: spin 9s linear infinite; }{% endif %}
                      @keyframes breathe-icon { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
                      @keyframes spin { to { transform: rotate(360deg); } }
                    .: >
                      {% set cl = states('climate.schlafzimmer_daitsu_artic_plus') %}
                      {% set colors = {'heat':'#f97316','cool':'#06b6d4','auto':'#14b8a6','dry':'#38bdf8','fan_only':'#14b8a6','off':'#64748b'} %}
                      {% set c = colors.get(cl, '#06b6d4') %}
                      {% set running = cl not in ['off','unavailable','unknown'] %}
                      {% set watt = states('sensor.schlafzimmer_daitsu_artic_plus_aktuelle_leistung') | int(0) %}
                      {% set pill = 'OFFLINE' if cl == 'unavailable' else 'STANDBY' if cl == 'off' else (watt ~ ' W • AKTIV') if watt > 0 else 'ONLINE • ' ~ (cl | upper) %}
                      {% set pbg = 'rgba(239, 68, 68, 0.15)' if cl == 'unavailable' else 'rgba(255, 255, 255, 0.05)' if cl == 'off' else (c ~ '24') %}
                      {% set pbd = 'rgba(239, 68, 68, 0.35)' if cl == 'unavailable' else 'rgba(255, 255, 255, 0.08)' if cl == 'off' else (c ~ '66') %}
                      {% set pfg = '#fca5a5' if cl == 'unavailable' else '#94a3b8' if cl == 'off' else '#f8fafc' %}
                      ha-card {
                        position: relative !important;
                        background: radial-gradient(circle at 12% 50%, {{ c }}38 0%, transparent 55%), linear-gradient(135deg, rgba(20, 24, 38, 0.95), rgba(10, 12, 20, 0.98)) !important;
                        border: 1px solid rgba(255, 255, 255, 0.08) !important;
                        border-bottom: none !important;
                        border-radius: 26px 26px 0 0 !important;
                        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55) !important;
                        overflow: hidden !important;
                        padding: 20px 135px 14px 20px !important;
                        animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
                      }
                      ha-card > * { position: relative; z-index: 1; }
                      ha-card::before {
                        content: ""; position: absolute; z-index: 0; top: -90%; left: -20%; width: 150%; height: 280%;
                        background: conic-gradient(from 0deg at 70% 50%, transparent, {{ c }}40, transparent 35%, {{ c }}26, transparent 70%);
                        filter: blur(30px); pointer-events: none; opacity: {{ 0.9 if running else 0.35 }};
                        {% if running %}animation: aurora 40s linear infinite;{% endif %}
                      }
                      ha-card::after {
                        content: "{{ pill }}";
                        position: absolute; z-index: 2; top: 22px; right: 20px;
                        background: {{ pbg }}; border: 1px solid {{ pbd }}; color: {{ pfg }};
                        font-size: 10px; font-weight: 700; letter-spacing: 0.8px; padding: 4px 10px; border-radius: 10px;
                      }
                      @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(0.97); } to { opacity: 1; transform: none; } }
                      @keyframes aurora { to { transform: rotate(360deg); } }
                      @media (prefers-reduced-motion: reduce) { ha-card, ha-card::before { animation: none !important; } }

              - type: tile
                entity: climate.schlafzimmer_daitsu_artic_plus
                name: Sollwert, Modus & Lüfter
                hide_state: true
                features:
                  - type: target-temperature
                  - type: climate-hvac-modes
                  - type: climate-fan-modes
                    style: dropdown
                card_mod:
                  style: >
                    ha-card {
                      position: relative !important;
                      background: linear-gradient(160deg, rgba(30, 35, 50, 0.92), rgba(13, 16, 25, 0.96)) !important;
                      border: 1px solid rgba(255, 255, 255, 0.07) !important;
                      border-radius: 0 0 26px 26px !important;
                      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06) !important;
                      overflow: hidden !important;
                      padding: 0 12px 12px 12px !important; margin-top: -1px !important; border-top: none !important;
                    }

          # 4 Moderne Rund-Gauges (Raum, Außen, Kompressor Hz, Außenlüfter rpm)
          - type: grid
            columns: 2
            square: false
            grid_options:
              columns: full
            cards:
              - type: custom:modern-circular-gauge
                entity: sensor.schlafzimmer_daitsu_artic_plus_raumtemperatur
                name: Raumtemperatur
                icon: mdi:home-thermometer
                min: 10
                max: 32
                gradient: true
                smooth_segments: true
                segments:
                  - from: 10
                    color: '#38bdf8'
                  - from: 17
                    color: '#6366f1'
                  - from: 20.5
                    color: '#10b981'
                  - from: 24
                    color: '#ef4444'
                card_mod:
                  style: >
                    ha-card {
                      background: radial-gradient(120% 100% at 100% 0%, rgba(34,211,238, 0.16), transparent 60%), linear-gradient(160deg, rgba(30, 35, 50, 0.92), rgba(13, 16, 25, 0.96)) !important;
                      border: 1px solid rgba(255, 255, 255, 0.07) !important;
                      border-radius: 22px !important;
                      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45) !important;
                      padding: 6px !important;
                    }
              - type: custom:modern-circular-gauge
                entity: sensor.schlafzimmer_daitsu_artic_plus_aussentemperatur
                name: Außentemperatur
                icon: mdi:thermometer
                min: -10
                max: 40
                gradient: true
                smooth_segments: true
                segments:
                  - from: -10
                    color: '#38bdf8'
                  - from: 5
                    color: '#14b8a6'
                  - from: 18
                    color: '#10b981'
                  - from: 28
                    color: '#f97316'
                card_mod:
                  style: >
                    ha-card {
                      background: radial-gradient(120% 100% at 100% 0%, rgba(56,189,248, 0.16), transparent 60%), linear-gradient(160deg, rgba(30, 35, 50, 0.92), rgba(13, 16, 25, 0.96)) !important;
                      border: 1px solid rgba(255, 255, 255, 0.07) !important;
                      border-radius: 22px !important;
                      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45) !important;
                      padding: 6px !important;
                    }
              - type: custom:modern-circular-gauge
                entity: sensor.schlafzimmer_daitsu_artic_plus_aktuelle_leistung
                name: Aktuelle Leistung
                icon: mdi:lightning-bolt
                min: 0
                max: 1500
                gradient: true
                smooth_segments: true
                segments:
                  - from: 0
                    color: '#10b981'
                  - from: 400
                    color: '#f59e0b'
                  - from: 900
                    color: '#ef4444'
                card_mod:
                  style: >
                    ha-card {
                      background: radial-gradient(120% 100% at 100% 0%, rgba(245,158,11, 0.16), transparent 60%), linear-gradient(160deg, rgba(30, 35, 50, 0.92), rgba(13, 16, 25, 0.96)) !important;
                      border: 1px solid rgba(255, 255, 255, 0.07) !important;
                      border-radius: 22px !important;
                      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45) !important;
                      padding: 6px !important;
                    }
              - type: custom:modern-circular-gauge
                entity: sensor.schlafzimmer_daitsu_artic_plus_stromverbrauch_intervall
                name: Intervall-Verbrauch
                icon: mdi:flash
                min: 0
                max: 0.05
                gradient: true
                smooth_segments: true
                segments:
                  - from: 0
                    color: '#14b8a6'
                  - from: 0.015
                    color: '#38bdf8'
                  - from: 0.03
                    color: '#a855f7'
                card_mod:
                  style: >
                    ha-card {
                      background: radial-gradient(120% 100% at 100% 0%, rgba(167,139,250, 0.16), transparent 60%), linear-gradient(160deg, rgba(30, 35, 50, 0.92), rgba(13, 16, 25, 0.96)) !important;
                      border: 1px solid rgba(255, 255, 255, 0.07) !important;
                      border-radius: 22px !important;
                      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45) !important;
                      padding: 6px !important;
                    }

          # Smart Klima-Assistent (nutzt direkt deine Daitsu-Sensoren + Diagnose)
          - type: custom:mushroom-template-card
            primary: >-
              {% set cl = states('climate.schlafzimmer_daitsu_artic_plus') %}
              {% set err = states('sensor.schlafzimmer_daitsu_artic_plus_fehlerdiagnose') %}
              {% set inn = states('sensor.schlafzimmer_daitsu_artic_plus_raumtemperatur') | float(21) %}
              {% set out = states('sensor.schlafzimmer_daitsu_artic_plus_aussentemperatur') | float(inn) %}
              {% set d = (inn - out) | round(1) %}
              {% if cl == 'unavailable' %}Daitsu offline
              {% elif err not in ['Kein Fehler', 'unknown', 'unavailable', ''] %}Geräte-Diagnose: {{ err }}
              {% elif cl == 'cool' and d >= 2 %}Lüften statt Kühlen
              {% elif cl == 'heat' and d <= -2 %}Heizen eventuell unnötig
              {% elif cl == 'off' and inn >= 26 %}Raum ist warm
              {% elif cl == 'off' and inn <= 17 %}Raum ist kühl
              {% else %}Alles im grünen Bereich{% endif %}
            secondary: >-
              {% set cl = states('climate.schlafzimmer_daitsu_artic_plus') %}
              {% set inn = states('sensor.schlafzimmer_daitsu_artic_plus_raumtemperatur') | float(21) %}
              {% set out = states('sensor.schlafzimmer_daitsu_artic_plus_aussentemperatur') | float(inn) %}
              {% set watt = states('sensor.schlafzimmer_daitsu_artic_plus_aktuelle_leistung') | int(0) %}
              {% set d = (inn - out) | round(1) %}
              {% if cl == 'unavailable' %}Keine Verbindung zur Tuya Cloud
              {% elif cl == 'cool' and d >= 2 %}Draußen {{ d }}°C kühler – Fenster öffnen spart Strom
              {% elif cl == 'heat' and d <= -2 %}Draußen {{ (d * -1) }}°C wärmer als drinnen
              {% else %}Innen {{ inn }}°C • Außen {{ out }}°C • Leistung {{ watt }} W{% endif %}
            icon: >-
              {% set cl = states('climate.schlafzimmer_daitsu_artic_plus') %}
              {% set err = states('sensor.schlafzimmer_daitsu_artic_plus_fehlerdiagnose') %}
              {% if cl == 'unavailable' %}mdi:lan-disconnect
              {% elif err not in ['Kein Fehler', 'unknown', 'unavailable', ''] %}mdi:alert-circle
              {% else %}mdi:check-circle-outline{% endif %}
            icon_color: >-
              {% set cl = states('climate.schlafzimmer_daitsu_artic_plus') %}
              {% set err = states('sensor.schlafzimmer_daitsu_artic_plus_fehlerdiagnose') %}
              {% if cl == 'unavailable' or err not in ['Kein Fehler', 'unknown', 'unavailable', ''] %}red
              {% else %}green{% endif %}
            layout: horizontal
            grid_options:
              columns: full
            card_mod:
              style:
                mushroom-state-info$: >
                  .primary { font-size: 16px !important; font-weight: 600 !important; color: #f8fafc !important; }
                  .secondary { font-size: 11px !important; font-weight: 500 !important; color: #94a3b8 !important; white-space: normal !important; }
                mushroom-shape-icon$: |
                  :host { --icon-size: 40px; --icon-symbol-size: 22px; }
                .: >
                  {% set cl = states('climate.schlafzimmer_daitsu_artic_plus') %}
                  {% set ac = '#ef4444' if cl == 'unavailable' else '#10b981' %}
                  ha-card {
                    position: relative !important;
                    background: linear-gradient(160deg, rgba(30, 35, 50, 0.92), rgba(13, 16, 25, 0.96)) !important;
                    border: 1px solid rgba(255, 255, 255, 0.07) !important;
                    border-left: 4px solid {{ ac }} !important;
                    border-radius: 22px !important;
                    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45) !important;
                    padding: 16px 130px 16px 16px !important;
                    overflow: hidden !important;
                  }
                  ha-card::after {
                    content: "KLIMA-ASSISTENT"; position: absolute; z-index: 2; top: 50%; right: 16px; transform: translateY(-50%);
                    background: {{ ac }}22; border: 1px solid {{ ac }}66; color: {{ ac }};
                    font-size: 9px; font-weight: 800; letter-spacing: 0.8px; padding: 4px 9px; border-radius: 10px;
                  }

          # Schnellwahl Betriebsmodi (direkt ohne Szenen!)
          - type: custom:mushroom-title-card
            title: BETRIEBSMODI
            subtitle: ⚙️ DIREKTWAHL // DAITSU
            grid_options:
              columns: full
            card_mod:
              style: >
                ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding-top: 8px !important; padding-bottom: 4px !important; }
                .title { font-size: 16px !important; font-weight: 800 !important; letter-spacing: 2.5px !important; color: #cbd5e1 !important; }
                .subtitle { font-size: 10px !important; font-weight: 600 !important; letter-spacing: 1.5px !important; color: #64748b !important; text-transform: uppercase; }

          - type: grid
            columns: 2
            square: false
            grid_options:
              columns: full
            cards:
              - type: custom:mushroom-template-card
                entity: climate.schlafzimmer_daitsu_artic_plus
                primary: Heizen
                secondary: POWER-HEAT
                icon: mdi:white-balance-sunny
                icon_color: orange
                layout: horizontal
                tap_action:
                  action: perform-action
                  perform_action: climate.set_hvac_mode
                  target:
                    entity_id: climate.schlafzimmer_daitsu_artic_plus
                  data:
                    hvac_mode: heat
                card_mod:
                  style:
                    mushroom-state-info$: >
                      {% set active = is_state('climate.schlafzimmer_daitsu_artic_plus', 'heat') %}
                      .primary { font-size: 15px !important; font-weight: 600 !important; color: #f8fafc !important; }
                      .secondary { font-size: 9px !important; font-weight: 700 !important; letter-spacing: 1px !important; color: {{ 'rgba(255,255,255,0.85)' if active else '#64748b' }} !important; }
                    mushroom-shape-icon$: >
                      {% set active = is_state('climate.schlafzimmer_daitsu_artic_plus', 'heat') %}
                      :host { --icon-size: 40px; --icon-symbol-size: 22px; {% if active %}--icon-color: #ffffff !important; --shape-color: rgba(255,255,255,0.22) !important;{% endif %} }
                    .: >
                      {% set active = is_state('climate.schlafzimmer_daitsu_artic_plus', 'heat') %}
                      ha-card {
                        border-radius: 20px !important; padding: 14px !important;
                        border: 1px solid {{ 'rgba(255,255,255,0.25)' if active else 'rgba(255,255,255,0.07)' }} !important;
                        background: {{ 'linear-gradient(145deg, #f97316, #fbbf24)' if active else 'linear-gradient(160deg, rgba(30,35,50,0.92), rgba(13,16,25,0.96))' }} !important;
                        box-shadow: {{ '0 10px 26px #f9731666' if active else '0 10px 26px rgba(0,0,0,0.45)' }} !important;
                      }
              - type: custom:mushroom-template-card
                entity: climate.schlafzimmer_daitsu_artic_plus
                primary: Kühlen
                secondary: AKTIVE KÜHLUNG
                icon: mdi:snowflake
                icon_color: cyan
                layout: horizontal
                tap_action:
                  action: perform-action
                  perform_action: climate.set_hvac_mode
                  target:
                    entity_id: climate.schlafzimmer_daitsu_artic_plus
                  data:
                    hvac_mode: cool
                card_mod:
                  style:
                    mushroom-state-info$: >
                      {% set active = is_state('climate.schlafzimmer_daitsu_artic_plus', 'cool') %}
                      .primary { font-size: 15px !important; font-weight: 600 !important; color: #f8fafc !important; }
                      .secondary { font-size: 9px !important; font-weight: 700 !important; letter-spacing: 1px !important; color: {{ 'rgba(255,255,255,0.85)' if active else '#64748b' }} !important; }
                    mushroom-shape-icon$: >
                      {% set active = is_state('climate.schlafzimmer_daitsu_artic_plus', 'cool') %}
                      :host { --icon-size: 40px; --icon-symbol-size: 22px; {% if active %}--icon-color: #ffffff !important; --shape-color: rgba(255,255,255,0.22) !important;{% endif %} }
                    .: >
                      {% set active = is_state('climate.schlafzimmer_daitsu_artic_plus', 'cool') %}
                      ha-card {
                        border-radius: 20px !important; padding: 14px !important;
                        border: 1px solid {{ 'rgba(255,255,255,0.25)' if active else 'rgba(255,255,255,0.07)' }} !important;
                        background: {{ 'linear-gradient(145deg, #06b6d4, #3b82f6)' if active else 'linear-gradient(160deg, rgba(30,35,50,0.92), rgba(13,16,25,0.96))' }} !important;
                        box-shadow: {{ '0 10px 26px #06b6d466' if active else '0 10px 26px rgba(0,0,0,0.45)' }} !important;
                      }
              - type: custom:mushroom-template-card
                entity: climate.schlafzimmer_daitsu_artic_plus
                primary: Auto
                secondary: AUTOMATIK
                icon: mdi:autorenew
                icon_color: teal
                layout: horizontal
                tap_action:
                  action: perform-action
                  perform_action: climate.set_hvac_mode
                  target:
                    entity_id: climate.schlafzimmer_daitsu_artic_plus
                  data:
                    hvac_mode: auto
                card_mod:
                  style:
                    mushroom-state-info$: >
                      {% set active = is_state('climate.schlafzimmer_daitsu_artic_plus', 'auto') %}
                      .primary { font-size: 15px !important; font-weight: 600 !important; color: #f8fafc !important; }
                      .secondary { font-size: 9px !important; font-weight: 700 !important; letter-spacing: 1px !important; color: {{ 'rgba(255,255,255,0.85)' if active else '#64748b' }} !important; }
                    mushroom-shape-icon$: >
                      {% set active = is_state('climate.schlafzimmer_daitsu_artic_plus', 'auto') %}
                      :host { --icon-size: 40px; --icon-symbol-size: 22px; {% if active %}--icon-color: #ffffff !important; --shape-color: rgba(255,255,255,0.22) !important;{% endif %} }
                    .: >
                      {% set active = is_state('climate.schlafzimmer_daitsu_artic_plus', 'auto') %}
                      ha-card {
                        border-radius: 20px !important; padding: 14px !important;
                        border: 1px solid {{ 'rgba(255,255,255,0.25)' if active else 'rgba(255,255,255,0.07)' }} !important;
                        background: {{ 'linear-gradient(145deg, #14b8a6, #22d3ee)' if active else 'linear-gradient(160deg, rgba(30,35,50,0.92), rgba(13,16,25,0.96))' }} !important;
                        box-shadow: {{ '0 10px 26px #14b8a666' if active else '0 10px 26px rgba(0,0,0,0.45)' }} !important;
                      }
              - type: custom:mushroom-template-card
                entity: climate.schlafzimmer_daitsu_artic_plus
                primary: Stop / Aus
                secondary: STANDBY
                icon: mdi:power
                icon_color: red
                layout: horizontal
                tap_action:
                  action: perform-action
                  perform_action: climate.turn_off
                  target:
                    entity_id: climate.schlafzimmer_daitsu_artic_plus
                card_mod:
                  style:
                    mushroom-state-info$: >
                      {% set active = is_state('climate.schlafzimmer_daitsu_artic_plus', 'off') %}
